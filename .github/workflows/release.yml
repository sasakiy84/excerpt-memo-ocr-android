name: Release Android
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: bash scripts/setup-android-ci.sh
      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$ ]]
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'Missing ANDROID_KEYSTORE_BASE64'; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo 'Missing ANDROID_KEYSTORE_PASSWORD'; exit 1; }
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          printf 'ANDROID_KEYSTORE_PATH=%s/release.jks\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          python3 scripts/verify-models.py
          ./gradlew --no-daemon assembleRelease "-PreleaseVersion=${RELEASE_TAG#v}"
      - name: Verify APK and prepare assets
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/excerpt-memo-$RELEASE_TAG.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "dist/excerpt-memo-$RELEASE_TAG.apk"
          python3 scripts/verify-apk.py "dist/excerpt-memo-$RELEASE_TAG.apk" "${RELEASE_TAG#v}"
          (cd dist && sha256sum *.apk > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$RELEASE_TAG" dist/*.apk dist/SHA256SUMS --verify-tag --title "方解抄 $RELEASE_TAG" --notes-file docs/release-notes.md
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
