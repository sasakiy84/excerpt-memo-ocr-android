name: Release Android
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: bash scripts/setup-android-ci.sh
      - name: Build unsigned APK without signing credentials
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$ ]]
          python3 scripts/verify-models.py
          ./gradlew --no-daemon --dependency-verification=strict assembleRelease "-PreleaseVersion=${RELEASE_TAG#v}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: bash scripts/setup-android-ci.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: unsigned-apk
          path: unsigned
      - name: Sign APK without running Gradle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          umask 077
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          bash scripts/sign-release.sh unsigned/app-release-unsigned.apk "dist/excerpt-memo-$RELEASE_TAG.apk"
      - name: Verify APK and prepare assets
        run: |
          set -euo pipefail
          python3 scripts/verify-apk.py "dist/excerpt-memo-$RELEASE_TAG.apk" "${RELEASE_TAG#v}"
          (cd dist && sha256sum *.apk > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$RELEASE_TAG" dist/*.apk dist/SHA256SUMS --verify-tag --title "方解抄 $RELEASE_TAG" --notes-file docs/release-notes.md
